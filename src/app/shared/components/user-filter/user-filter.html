<mat-form-field appearance="outline">
  <mat-label>{{ label() }}</mat-label>

  <mat-select
    [value]="valor()"
    (valueChange)="alterarValor($event)"
    (openedChange)="!$event && limparPesquisa()"
  >
    <mat-option>
      <ngx-mat-select-search
        [ngModel]="pesquisa()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="alterarPesquisa($event)"
        placeholderLabel="Pesquisar..."
        noEntriesFoundLabel="Nenhum resultado encontrado"
      />
    </mat-option>

    @if (mostrarTodos()) {
      <mat-option [value]="null"> Todos </mat-option>
    }

    @for (item of itensFiltrados(); track item.id) {
      <mat-option [value]="item.id">
        {{ item.nome }}
      </mat-option>
    }
  </mat-select>

  @if (valor() !== null) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      aria-label="Limpar filtro"
      (click)="limpar($event)"
    >
      <mat-icon class="close-button">close</mat-icon>
    </button>
  }
</mat-form-field>
