<mat-sidenav-container class="app-container">

  <mat-sidenav
    #sidenav
    class="app-sidenav"
    [mode]="isCompact ? 'over' : 'side'"
    [opened]="!isCompact"
  >

    <div class="brand">
      <img
        src="/images/LogoEnhenhariaeQualidade.png"
        alt="Engenharia e Qualidade"
      />

      <div class="brand-title">
        Gestão de Performance
      </div>
    </div>

    <nav class="main-menu">
      @for (
        item of menuItems.filter((item) => item.active);
        track item.route
      ) {
        <a
          class="menu-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="fecharSidenav(sidenav)"
        >
          <mat-icon>
            {{ item.icon }}
          </mat-icon>

          <span>
            {{ item.label }}
          </span>
        </a>
      }
    </nav>

  </mat-sidenav>

  <mat-sidenav-content class="app-content">

    <app-toobar
      [title]="title"
      [description]="description"
      [mostrarMenu]="isCompact"
      (menuClick)="abrirSidenav(sidenav)"
    />

    <router-outlet />

  </mat-sidenav-content>

</mat-sidenav-container>
