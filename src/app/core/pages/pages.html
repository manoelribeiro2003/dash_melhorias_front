<mat-sidenav-container class="app-container">

  <mat-sidenav #sidenav class="app-sidenav" mode="side" opened>

    <div class="brand">
      <img src="/images/LogoEnhenhariaeQualidade.png" alt="Engenharia e Qualidade" />
      <div class="brand-title">Gestão de Projetos</div>
    </div>

    <nav class="main-menu">
      @for (item of menuItems.filter((item) => item.active); track item.route) {
        <a
          class="menu-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          router
          [routerLinkActiveOptions]="{ exact: item.exact }"
          disabled
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </mat-sidenav>
  <mat-sidenav-content class="app-content">
    <app-toobar [title]="title" [description]="description" />
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
