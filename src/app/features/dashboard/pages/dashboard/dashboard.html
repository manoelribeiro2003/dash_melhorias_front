<div class="dashboard-layout">

  <div class="dashboard-tabs">
    <mat-tab-group
      [selectedIndex]="selectedIndex()"
      (selectedIndexChange)="trocarAba($event)"
      animationDuration="250ms"
      dynamicHeight
    >
      <mat-tab label="Projetos por Supervisores"></mat-tab>
      <mat-tab label="Projetos por Liderados"></mat-tab>
      <mat-tab label="Projetos do Liderado"></mat-tab>
    </mat-tab-group>
  </div>

  <div class="dashboard-content">
    <router-outlet />
  </div>
</div>
