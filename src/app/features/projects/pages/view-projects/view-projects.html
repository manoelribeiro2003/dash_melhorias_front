<div class="main">
  <div class="app-card-status-container">
    @for (cardValue of cardValues; track cardValue) {
      <app-card-status-project
        [status]="cardValue.status"
        [value]="
          cardValue.status === 'TotalItens'
            ? projetosFiltrados().length
            : cardValue.atrasado
              ? projetosFiltrados().filter((projeto) => projeto.atrasado).length
              : projetosFiltrados().filter((projeto) => projeto.status === cardValue.status).length
        "
        [icon]="cardValue.icon"
        [title]="cardValue.title"
        [itensConcluidos]="
          cardValue.atrasado
            ? projetosFiltrados().filter((projeto) => projeto.atrasado).length
            : projetosFiltrados().filter((projeto) => projeto.status === cardValue.status).length
        "
        [totalItens]="projetosFiltrados().length"
      />
    }
  </div>
  <div class="app-projects-card-container">
    <app-projects-card
      [(usuarioSelecionado)]="usuarioSelecionado"
      [(gestorSelecionado)]="gestorSelecionado"
      [(statusSelecionado)]="statusSelecionado"
    />
  </div>
</div>
