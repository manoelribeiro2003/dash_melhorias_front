<div class="main">
  <div class="app-card-status-container">
    @for (cardValue of cardValues; track cardValue.title) {
      <app-card-status-project
        [icon]="cardValue.icon"
        [title]="cardValue.title"
        [value]="cardValue.value()"
        [tipoValor]="cardValue.tipoValor ?? 'numero'"
        [mostrarProgresso]="cardValue.mostrarProgresso ?? false"
        [itensConcluidos]="cardValue.itensConcluidos?.() ?? 0"
        [totalItens]="cardValue.totalItens?.() ?? 0"
      />
    }
  </div>

  <div class="app-projects-card-container">
    <app-projects-card
      [(usuarioSelecionado)]="usuarioSelecionado"
      [(gestorSelecionado)]="gestorSelecionado"
      [(statusSelecionado)]="statusSelecionado"
      [(catSelecionada)]="categoriaSelecionada"
    />
  </div>
</div>
